<style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Epilogue:ital,wght@0,300;0,400;0,500;1,300&family=Cairo:wght@400;600;700&display=swap');

    #ld {
        font-family: 'Epilogue', sans-serif;
        background: #080808;
        color: #F0EDE8;
        min-height: 100vh;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column
    }

    .s {
        min-height: calc(100vh - 52px);
        padding: 48px 56px 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        overflow: hidden
    }

    .syne {
        font-family: 'Syne', sans-serif
    }

    .cairo {
        font-family: 'Cairo', Tahoma, Arial, sans-serif
    }

    @keyframes fu {
        from {
            opacity: 0;
            transform: translateY(12px)
        }

        to {
            opacity: 1;
            transform: translateY(0)
        }
    }

    .fi {
        animation: fu .38s ease forwards
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0
    }

    table {
        border-collapse: collapse;
        width: 100%
    }

    button {
        cursor: pointer;
        font-family: inherit
    }

    ::-webkit-scrollbar {
        display: none
    }
</style>
<div id="ld"></div>
<div id="nav"
    style="position:fixed;bottom:0;left:0;right:0;padding:10px 56px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to top,rgba(8,8,8,.98) 60%,transparent);z-index:99">
    <div id="dots" style="display:flex;gap:5px;align-items:center"></div>
    <div id="sname"
        style="font-family:'Syne',sans-serif;font-size:10px;color:#333;letter-spacing:.1em;text-transform:uppercase">
    </div>
    <div style="display:flex;gap:8px">
        <button id="pb" onclick="go(-1)"
            style="width:30px;height:30px;border-radius:50%;background:#111;border:1px solid #1e1e1e;color:#555;font-size:14px;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg></button>
        <button id="nb" onclick="go(1)"
            style="width:30px;height:30px;border-radius:50%;background:#F0B429;border:none;color:#000;font-size:14px;display:flex;align-items:center;justify-content:center;font-weight:700"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg></button>
    </div>
</div>
<script>
    const G = "#F0B429", RU = "#D95C38", GR = "#3DAA68", BG = "#080808", S1 = "#0f0f0f", BR = "#1e1e1e", TX = "#F0EDE8", MT = "#555550";
    const SLIDES = [
        { id: "cover", name: "Cover" },
        { id: "hook", name: "The Hook" },
        { id: "problem", name: "Problem" },
        { id: "gap", name: "Market Gap" },
        { id: "competitive", name: "Competitive" },
        { id: "solution", name: "Solution" },
        { id: "diffs", name: "Differentiators" },
        { id: "biz", name: "Business Model" },
        { id: "exit", name: "Exit Strategy" },
        { id: "next", name: "Next Steps" }
    ];
    let cur = 0, busy = false;

    function badge(t, c = G) { return `<span style="display:inline-flex;align-items:center;align-self:flex-start;width:fit-content;background:${c}18;border:1px solid ${c}35;border-radius:20px;padding:4px 13px;color:${c};font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-family:'Syne',sans-serif">${t}</span>` }
    function card(html, gold = false, style = "") { return `<div style="background:${gold ? `${G}09` : `${S1}`};border:1px solid ${gold ? `${G}30` : BR};border-radius:14px;padding:22px;${style}">${html}</div>` }
    function dot(c = G) { return `<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${c};flex-shrink:0;margin-top:7px"></span>` }
    function h2(txt) { return `<h2 style="font-family:'Syne',sans-serif;font-size:clamp(26px,3.2vw,44px);font-weight:800;line-height:1.05;color:${TX};letter-spacing:-.03em;margin-bottom:8px">${txt}</h2>` }
    function gold(t) { return `<span style="color:${G}">${t}</span>` }
    function rust(t) { return `<span style="color:${RU}">${t}</span>` }
    function icon(name, color = "currentColor", size = 16, stroke = 1.9) {
        const common = `width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round"`;
        const paths = {
            chevronRight: `<path d="m9 18 6-6-6-6"/>`,
            lightbulb: `<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.8c.8.6 1.2 1.6 1.2 2.6V18h5.6v-.6c0-1 .4-2 1.2-2.6A7 7 0 0 0 12 2Z"/>`,
            cpu: `<rect x="7" y="7" width="10" height="10" rx="2"/><path d="M12 7V4M12 20v-3M7 12H4M20 12h-3M17 7l2-2M5 19l2-2M17 17l2 2M5 5l2 2"/>`,
            image: `<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m21 16-5-4-4 3-2-1.5L3 19"/>`,
            refresh: `<path d="M21 2v6h-6"/><path d="M3 22v-6h6"/><path d="M20.5 13A8 8 0 0 0 7 5.2L3 8"/><path d="M3.5 11A8 8 0 0 0 17 18.8L21 16"/>`,
            coin: `<circle cx="12" cy="12" r="9"/><path d="M12 7v10"/><path d="M15 9.5c0-1.1-1.3-2-3-2s-3 .9-3 2 1.3 2 3 2 3 .9 3 2-1.3 2-3 2-3-.9-3-2"/>`,
            clock: `<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>`,
            check: `<path d="m6 12 4 4 8-8"/>`,
            close: `<path d="m18 6-12 12"/><path d="m6 6 12 12"/>`,
            minus: `<path d="M6 12h12"/>`,
            sparkles: `<path d="M12 3 13.8 8.2 19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="m19 3 .8 2.2L22 6l-2.2.8L19 9l-.8-2.2L16 6l2.2-.8L19 3Z"/><path d="m5 15 .8 2.2L8 18l-2.2.8L5 21l-.8-2.2L2 18l2.2-.8L5 15Z"/>`,
            monogram: `<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6v6H9z"/>`,
            palette: `<path d="M12 3a9 9 0 1 0 0 18h1.2a2.3 2.3 0 0 0 0-4.6H11a2.5 2.5 0 0 1 0-5h5a5 5 0 0 0 0-10h-4Z"/><circle cx="7.5" cy="10.5" r="1"/><circle cx="10" cy="7.5" r="1"/><circle cx="14.5" cy="7.5" r="1"/><circle cx="16.5" cy="11" r="1"/>`,
            external: `<path d="M14 4h6v6"/><path d="m10 14 10-10"/><path d="M20 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4"/>`,
            code: `<path d="m9 18-6-6 6-6"/><path d="m15 6 6 6-6 6"/><path d="m14 4-4 16"/>`,
            card: `<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/>`
        };
        return `<svg ${common} aria-hidden="true" focusable="false">${paths[name] || ""}</svg>`;
    }
    function iconBox(name, color = G, bg = `${G}14`, border = `${G}2a`) {
        return `<span style="display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:${bg};border:1px solid ${border};flex-shrink:0">${icon(name, color, 12, 2)}</span>`;
    }

    function renderCover() {
        return `
<div class="s syne" style="position:relative">
  <div style="position:absolute;right:-40px;top:50%;transform:translateY(-50%);font-family:'Syne',sans-serif;font-size:clamp(240px,35vw,420px);font-weight:800;color:#111;line-height:1;user-select:none;pointer-events:none;letter-spacing:-.05em">L</div>
  <div style="position:absolute;inset:0;background-image:linear-gradient(${BR} 1px,transparent 1px),linear-gradient(90deg,${BR} 1px,transparent 1px);background-size:52px 52px;opacity:.3;pointer-events:none"></div>
  ${badge("Startup Pitch Deck · 2025")}
  <div style="height:24px"></div>
  <h1 style="font-family:'Syne',sans-serif;font-size:clamp(64px,10vw,110px);font-weight:800;line-height:.88;color:${TX};letter-spacing:-.05em">Letriq</h1>
  <div style="width:52px;height:3px;background:linear-gradient(to right,${G},${RU});margin:22px 0;border-radius:2px"></div>
  <p style="font-size:clamp(14px,1.7vw,18px);font-weight:300;color:#888;max-width:540px;line-height:1.55;margin-bottom:44px">
    Open-source AI identity studio for ${gold("wordmarks")}, ${gold("lettermarks")}, and full brand systems.<br><br>
    <em style="color:#555">Because seeing a logo should come before paying for one.</em>
  </p>
  <div style="display:flex;gap:clamp(20px,4vw,48px);flex-wrap:wrap">
    ${[["$4.8B", "Addressable Market"], ["0", "Free Open-Source Competitors"], ["3", "Revenue Streams"]].map(([n, l]) => `
    <div>
      <div style="font-family:'Syne',sans-serif;font-size:clamp(24px,3.5vw,38px);font-weight:700;color:${G}">${n}</div>
      <div style="font-size:11px;color:${MT};margin-top:3px;letter-spacing:.03em">${l}</div>
    </div>`).join("")}
  </div>
</div>`}

    function renderHook() {
        return `
<div class="s" style="padding-top:36px">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;height:100%">
    <div dir="rtl" style="text-align:right">
      ${badge("عرض الفريق", G)}
      <div style="height:20px"></div>
      <p class="cairo" style="font-size:clamp(16px,2vw,21px);font-weight:600;color:${TX};line-height:1.8;margin-bottom:16px">مين فينا ما مرّش بالموقف ده؟</p>
      <p class="cairo" style="font-size:clamp(13px,1.5vw,15px);color:#999;line-height:2;margin-bottom:20px">
        عندك فكرة مشروع تحرق جوّاك، بس لما تيجي تعمل هوية بصرية...<br>
        الميزانية <span style="color:${RU}">صفر.</span><br>
        فتروح لـ AI، تقوله "عايز لوجو"، ويطلعلك حاجة<br>
        <span style="color:${RU}">generic وفارغة</span> مش بتعبّر عن أي حاجة.<br>
        ليه؟ لأن الـ AI العام مش متخصص في الـ brand identity.
      </p>
      <div style="padding-right:18px;border-right:3px solid ${G}">
        <p class="cairo" style="font-size:clamp(13px,1.5vw,15px);color:${TX};line-height:2.1">
          <strong style="color:${G}">Letriq</strong> جاي يكسر المعادلة دي.<br>
          أول AI identity studio متخصص في الـ wordmarks والـ lettermarks،<br>
          مفتوح المصدر ومجاني.<br>
          لأن اللي المفروض يوقفك هو فكرتك — مش ميزانيتك.
        </p>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      ${card(`<div style="font-size:10px;color:${MT};letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;font-family:'Syne',sans-serif">English Translation</div>
      <p style="font-size:13px;color:#888;line-height:1.75;font-style:italic">"Who hasn't been there? You have a burning startup idea, but when it comes to brand identity — the budget is zero. You turn to AI, ask for a logo, and get back something generic and lifeless. Why? Because general AI isn't built for brand identity.<br><br>
      Letriq breaks that equation. The first AI identity studio specialized in wordmarks and lettermarks — open-source and free. Because what should stop you is your idea, not your budget."</p>`)}
      ${card(`<div style="font-size:10px;color:${MT};letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;font-family:'Syne',sans-serif">The Current Cycle</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px">
        ${[
                { icon: "lightbulb", label: "Idea", tone: "#666", alert: false },
                { icon: "cpu", label: "AI Tool", tone: "#666", alert: false },
                { icon: "image", label: "Generic PNG", tone: "#666", alert: false },
                { icon: "refresh", label: "Back to zero", tone: RU, alert: true }
            ].map((t, i, arr) => `
            <span style="display:inline-flex;align-items:center;gap:6px;background:${BG};border:1px solid ${BR};border-radius:6px;padding:5px 10px;color:${t.tone};font-size:12px">${icon(t.icon, t.alert ? RU : "#8a8a8a", 13, 1.9)} ${t.label}</span>
            ${i < arr.length - 1 ? `<span style="display:inline-flex;align-items:center;justify-content:center;color:#2a2a2a">${icon("chevronRight", "#2a2a2a", 14, 2.2)}</span>` : ""}`).join("")}
      </div>`)}
    </div>
  </div>
</div>`}

    function renderProblem() {
        return `
<div class="s">
  ${badge("The Problem", RU)}
  <div style="height:16px"></div>
  ${h2(`Why founders are ${rust("stuck")}`)}
  <p style="color:${MT};margin-bottom:28px;font-size:14px">Brand identity is a bottleneck that kills momentum before launch.</p>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
    ${[
                { e: "coin", t: "Cost Barrier", d: "Professional brand identity costs $300–$2,000+. Looka alone charges $65–$192/year. Early-stage founders either skip it entirely or get stuck.", n: "$300–2K", l: "avg. brand identity cost", c: RU },
                { e: "cpu", t: "AI Disappointment", d: "General AI tools (Midjourney, DALL-E) produce raster images — not brand systems. Output is uncreative, non-scalable, and can't be used professionally.", n: "0", l: "free AI tools specialized for brand identity", c: RU },
                { e: "clock", t: "Freelancer Friction", d: "Freelancers take 3–7 days minimum. Revisions add weeks. Brand identity becomes a launch blocker, not an enabler.", n: "3–7 days", l: "avg. freelancer turnaround", c: RU }
            ].map(p => `
    <div style="background:${S1};border:1px solid ${BR};border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px">
      <div style="display:inline-flex;width:38px;height:38px;border-radius:10px;background:${RU}16;border:1px solid ${RU}32;align-items:center;justify-content:center">${icon(p.e, RU, 19, 2)}</div>
      <h3 style="font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:${TX}">${p.t}</h3>
      <p style="font-size:12px;color:${MT};line-height:1.6">${p.d}</p>
      <div style="margin-top:auto;padding-top:14px;border-top:1px solid ${BR}">
        <div style="font-family:'Syne',sans-serif;font-size:24px;font-weight:700;color:${p.c}">${p.n}</div>
        <div style="font-size:10px;color:${MT};letter-spacing:.05em;margin-top:2px">${p.l}</div>
      </div>
    </div>`).join("")}
  </div>
</div>`}

    function renderGap() {
        const pts = [{ n: "Looka", x: 78, y: 62 }, { n: "Brandmark", x: 61, y: 44 }, { n: "Canva", x: 44, y: 20 }, { n: "Midjourney", x: 50, y: 11 }, { n: "Freelancers", x: 88, y: 77 }, { n: "Letriq", x: 10, y: 87, star: true }];
        return `
<div class="s">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center">
    <div>
      ${badge("Market Gap")}
      <div style="height:16px"></div>
      ${h2(`One quadrant ${gold("nobody owns")}`)}
      <p style="color:${MT};margin-bottom:24px;font-size:14px;line-height:1.6">Every brand identity tool is either expensive <em>or</em> generic. The intersection of <strong style="color:${TX}">free + specialized</strong> has been completely ignored.</p>
      <div style="display:flex;flex-direction:column;gap:9px">
        ${["No free, open-source AI brand identity tool exists", "No AI tool specializes in wordmarks / lettermarks", "No free tool generates a complete brand system", "No free tool exports proper vector (SVG/AI) files", "No open-source community around brand identity AI"].map(t => `
        <div style="display:flex;align-items:flex-start;gap:10px">
          <span style="width:6px;height:6px;border-radius:50%;background:${G};flex-shrink:0;margin-top:6px;display:inline-block"></span>
          <span style="font-size:13px;color:#999;line-height:1.5">${t}</span>
        </div>`).join("")}
      </div>
    </div>
    <div style="position:relative;width:100%;padding-bottom:92%">
      <div style="position:absolute;inset:0;background:${S1};border:1px solid ${BR};border-radius:16px;overflow:hidden">
        <div style="position:absolute;left:50%;top:8%;bottom:8%;width:1px;background:${BR}"></div>
        <div style="position:absolute;top:50%;left:8%;right:8%;height:1px;background:${BR}"></div>
        <div style="position:absolute;bottom:3%;left:9%;font-size:9px;color:${MT};letter-spacing:.1em;text-transform:uppercase">FREE</div>
        <div style="position:absolute;bottom:3%;right:6%;font-size:9px;color:${MT};letter-spacing:.1em;text-transform:uppercase">EXPENSIVE</div>
        <div style="position:absolute;top:8%;left:52%;font-size:9px;color:${MT};letter-spacing:.08em;text-transform:uppercase">SPECIALIZED</div>
        <div style="position:absolute;bottom:52%;left:52%;font-size:9px;color:${MT};letter-spacing:.08em;text-transform:uppercase">GENERIC</div>
        <div style="position:absolute;left:8%;top:8%;width:42%;height:42%;background:${G}08;border:1px dashed ${G}30;border-radius:8px;display:flex;align-items:center;justify-content:center">
          <div style="text-align:center;font-family:'Syne',sans-serif;font-size:9px;color:${G}70;font-weight:600;line-height:1.7">THE GAP<br>LETRIQ FILLS</div>
        </div>
        ${pts.map(p => `
        <div style="position:absolute;left:${p.x}%;top:${100 - p.y}%;transform:translate(-50%,-50%)">
          <div style="width:${p.star ? 14 : 9}px;height:${p.star ? 14 : 9}px;border-radius:50%;background:${p.star ? G : "#3a3a3a"};${p.star ? `box-shadow:0 0 12px ${G}50;border:2px solid ${G}` : ""}"></div>
          <div style="position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-family:'Syne',sans-serif;font-size:${p.star ? 10 : 9}px;color:${p.star ? G : MT};white-space:nowrap;font-weight:${p.star ? 700 : 400}">${p.n}</div>
        </div>`).join("")}
      </div>
    </div>
  </div>
</div>`}

    function renderCompetitive() {
        const COLS = ["Looka", "Canva", "Brandmark", "Midjourney", "Letriq"];
        const ROWS = [
            { l: "Free Tier", v: [false, "limited", false, false, true] },
            { l: "Vector Export (Free)", v: [false, false, false, false, true] },
            { l: "Wordmark Focused", v: ["~", false, "~", false, true] },
            { l: "Full Brand System", v: ["$", false, "$", false, true] },
            { l: "Open Source", v: [false, false, false, false, true] },
            { l: "Developer API", v: ["$", "$", false, "$", true] }
        ];
        function cell(v, gold) {
            if (v === true) return `<div style="width:20px;height:20px;border-radius:50%;background:${gold ? G : GR};display:flex;align-items:center;justify-content:center;margin:auto;color:${gold ? "#000" : "#fff"}">${icon("check", "currentColor", 12, 2.4)}</div>`;
            if (v === false) return `<div style="width:20px;height:20px;border-radius:50%;background:#181818;display:flex;align-items:center;justify-content:center;margin:auto;color:#2a2a2a">${icon("close", "currentColor", 12, 2.2)}</div>`;
            if (v === "~") return `<div style="width:20px;height:20px;border-radius:50%;background:#1a1900;display:flex;align-items:center;justify-content:center;margin:auto;color:#6a5200">${icon("minus", "currentColor", 12, 2.2)}</div>`;
            return `<div style="display:flex;align-items:center;justify-content:center;gap:4px;font-size:11px;color:#444">${icon("card", "#555", 12, 1.9)} paid</div>`;
        }
        return `
<div class="s">
  ${badge("Competitive Analysis")}
  <div style="height:14px"></div>
  ${h2(`We win on ${gold("every axis")}`)}
  <p style="color:${MT};margin-bottom:22px;font-size:13px">Feature comparison across the top brand identity tools.</p>
  <table>
    <thead><tr>
      <th style="text-align:left;padding:8px 14px;color:${MT};font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-family:'Syne',sans-serif">Feature</th>
      ${COLS.map(c => `<th style="text-align:center;padding:8px 10px;font-family:'Syne',sans-serif;color:${c === "Letriq" ? G : MT};font-weight:${c === "Letriq" ? 700 : 500};font-size:12px;background:${c === "Letriq" ? `${G}08` : "transparent"};border-bottom:2px solid ${c === "Letriq" ? G : BR}">${c}</th>`).join("")}
    </tr></thead>
    <tbody>
      ${ROWS.map(r => `<tr style="border-bottom:1px solid ${BR}">
        <td style="padding:11px 14px;color:#aaa;font-size:13px">${r.l}</td>
        ${COLS.map((c, i) => `<td style="padding:11px 10px;text-align:center;background:${c === "Letriq" ? `${G}04` : "transparent"}">${cell(r.v[i], c === "Letriq")}</td>`).join("")}
      </tr>`).join("")}
    </tbody>
  </table>
  <div style="margin-top:14px;display:flex;gap:16px;flex-wrap:wrap">
    ${[
            { i: iconBox("check", GR, `${GR}14`, `${GR}30`), l: "Available", c: GR },
            { i: iconBox("minus", "#886600", "#1a1900", "#3a2d00"), l: "Partial", c: "#886600" },
            { i: iconBox("card", MT, "#151515", "#2c2c2c"), l: "Paid only", c: MT },
            { i: iconBox("close", "#333", "#171717", "#242424"), l: "Not available", c: "#333" }
        ].map(x => `<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:${x.c}">${x.i}<span>${x.l}</span></div>`).join("")}

    const RENDERS = [renderCover, renderHook, renderProblem, renderGap, renderCompetitive, renderSolution, renderDiffs, renderBiz, renderExit, renderNext];
    const N = SLIDES.length;

    function go(dir) {
        if (busy) return;
        const next = cur + dir;
        if (next < 0 || next >= N) return;
        busy = true;
        const el = document.getElementById("ld");
        el.style.opacity = 0;
        el.style.transition = "opacity .25s ease";
        setTimeout(() => {
            cur = next; render();
            el.style.opacity = 1;
            busy = false;
        }, 260);
    }

    function render() {
        const el = document.getElementById("ld");
        el.innerHTML = RENDERS[cur]();
        el.classList.add("fi");
        setTimeout(() => el.classList.remove("fi"), 400);
        // dots
        const d = document.getElementById("dots");
        d.innerHTML = SLIDES.map((_, i) => `<div onclick="if(!busy){cur=${i};render()}" style="width:${i === cur ? 22 : 6}px;height:4px;border-radius:2px;background:${i === cur ? G : "#1e1e1e"};cursor:pointer;transition:all .25s ease"></div>`).join("");
        document.getElementById("sname").textContent = SLIDES[cur].name;
        const pb = document.getElementById("pb"), nb = document.getElementById("nb");
        pb.style.color = cur === 0 ? "#2a2a2a" : "#666";
        pb.style.background = cur === 0 ? "#0a0a0a" : "#111";
        nb.style.background = cur === N - 1 ? "#111" : G;
        nb.style.color = cur === N - 1 ? "#2a2a2a" : "#000";
    }

    document.addEventListener("keydown", e => {
        if (e.key === "ArrowRight" || e.key === "ArrowDown") go(1);
        if (e.key === "ArrowLeft" || e.key === "ArrowUp") go(-1);
    });

    render();
